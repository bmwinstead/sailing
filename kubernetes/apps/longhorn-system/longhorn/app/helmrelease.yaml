---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      version: 1.12.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1h
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 1
      storageReservedPercentageForDefaultDisk: 10
      # pop-os is a GPU node with no iscsiadm. Keep Longhorn on k8s-3 only.
      systemManagedComponentsNodeSelector: kubernetes.io/hostname:k8s-3
    longhornManager:
      nodeSelector:
        kubernetes.io/hostname: k8s-3
    longhornDriver:
      nodeSelector:
        kubernetes.io/hostname: k8s-3
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
    longhornUI:
      replicas: 1
