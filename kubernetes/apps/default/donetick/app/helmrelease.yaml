---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  chartRef:
    kind: OCIRepository
    name: donetick
  interval: 1h
  values:
    controllers:
      donetick:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: donetick/donetick
              tag: v0.1.86@sha256:66253a32a8e8ed8c49c49418b43abe1181db23e07defe97748d2cb7508c487cd
            env:
              TZ: America/New_York
              # Donetick writes /config/selfhosted.yaml with a random JWT secret on first start. The PVC keeps it.
              DT_ENV: selfhosted
              DT_SQLITE_PATH: /donetick-data/donetick.db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 2021
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Donetick
          gethomepage.dev/description: Chore tracker
          gethomepage.dev/group: Home
          gethomepage.dev/icon: donetick
          gethomepage.dev/href: "https://donetick.${SECRET_DOMAIN}"
          gethomepage.dev/siteMonitor: "https://donetick.${SECRET_DOMAIN}"
        hostnames:
          - "donetick.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: donetick-longhorn
        globalMounts:
          - path: /donetick-data
            subPath: data
          - path: /config
            subPath: config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
