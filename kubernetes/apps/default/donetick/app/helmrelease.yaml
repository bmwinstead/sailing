---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  chartRef:
    kind: OCIRepository
    name: donetick
  interval: 1h
  values:
    controllers:
      donetick:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: donetick/donetick
              tag: v0.1.89@sha256:cfe1875c9d04ea89b2e6a60f1a36b28c32661ff2d48c5b8e26dca265bb69d984
            env:
              TZ: America/New_York
              # Donetick writes /config/selfhosted.yaml with a random JWT secret on first start. The PVC keeps it.
              DT_ENV: selfhosted
              DT_SQLITE_PATH: /donetick-data/donetick.db
              # Env vars override /config/selfhosted.yaml (viper AutomaticEnv), so the persisted file needs no edit.
              DT_OAUTH2_NAME: Pocket ID
              DT_OAUTH2_AUTH_URL: https://id.${SECRET_DOMAIN}/authorize
              DT_OAUTH2_TOKEN_URL: https://id.${SECRET_DOMAIN}/api/oidc/token
              DT_OAUTH2_USER_INFO_URL: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
              DT_OAUTH2_REDIRECT_URL: https://donetick.${SECRET_DOMAIN}/auth/oauth2
              # The default scopes have no "groups". Pocket ID returns the groups claim only for this scope.
              DT_OAUTH2_SCOPES: openid,profile,email,groups
              DT_OAUTH2_ADMIN_GROUPS: admins
              DT_OAUTH2_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: donetick-oidc
                    key: client-id
              DT_OAUTH2_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: donetick-oidc
                    key: client-secret
              # SSO only. The API token for Home Assistant (secretkey header) does not use the password routes.
              DT_DISABLE_PASSWORD_AUTH: "true"
              # One shared circle, so the group to role mapping applies to the whole family.
              DT_SINGLE_CIRCLE_INSTANCE: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 2021
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Donetick
          gethomepage.dev/description: Chore tracker
          gethomepage.dev/group: Home
          gethomepage.dev/icon: donetick
          gethomepage.dev/href: "https://donetick.${SECRET_DOMAIN}"
          gethomepage.dev/siteMonitor: "https://donetick.${SECRET_DOMAIN}"
        hostnames:
          - "donetick.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: donetick-longhorn
        globalMounts:
          - path: /donetick-data
            subPath: data
          - path: /config
            subPath: config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
