---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.16.2/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sabnzbd
spec:
  callbackUrls:
    - https://sabnzbd.${SECRET_DOMAIN}/oauth2/callback
  allowedUserGroups:
    - name: admins
      namespace: auth
  secret:
    name: sabnzbd-oidc
    # Envoy Gateway reads exactly these key names.
    keys:
      clientID: client-id
      clientSecret: client-secret
