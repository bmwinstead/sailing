---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
data:
  configuration.yaml: |-
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16

    recorder:
      db_url: !env_var RECORDER_DB_URL

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
