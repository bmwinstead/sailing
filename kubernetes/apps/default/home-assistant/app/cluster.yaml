---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      encoding: UTF8
      localeCType: C
      localeCollate: C
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
