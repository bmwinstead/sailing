---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-db
spec:
  schedule: "0 0 3 * * *" # seconds field first
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: home-assistant-db
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
