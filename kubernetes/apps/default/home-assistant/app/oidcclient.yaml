---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.16.2/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: home-assistant
spec:
  # Callback for the hass-oidc-auth custom component.
  callbackUrls:
    - https://home-assistant.${SECRET_DOMAIN}/auth/oidc/callback
  allowedUserGroups:
    - name: admins
      namespace: auth
    - name: family
      namespace: auth
  secret:
    name: home-assistant-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
