---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  dependsOn:
    - name: barman-cloud-plugin # ObjectStore CRD and plugin
      namespace: cnpg-system
    - name: cloudnative-pg # Cluster CRD and webhook
      namespace: cnpg-system
    - name: pocket-id # PocketIDOIDCClient CRD and operator
      namespace: auth
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cnpg-r2-credentials # R2_ENDPOINT for the ObjectStore
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
