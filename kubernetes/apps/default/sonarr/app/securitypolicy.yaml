---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sonarr
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sonarr # generated by the app-template chart: route "app" in release "sonarr"
  oidc:
    provider:
      issuer: https://id.${SECRET_DOMAIN}
    clientIDRef:
      name: sonarr-oidc
    clientSecret:
      name: sonarr-oidc
    redirectURL: https://sonarr.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
