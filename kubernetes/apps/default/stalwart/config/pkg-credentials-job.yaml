---
# Mints the app passwords of packages@bmwinstead.com and writes them, with the JMAP ids, to SSM.
# Runs in parallel with stalwart-config. It fails and restarts until that Job has created the account.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-pkg-credentials
spec:
  backoffLimit: 20
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mint
          # bash, curl, jq and the aws CLI in one image.
          image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - bash
            - /script/pkg-credentials.sh
          env:
            - name: STALWART_URL
              value: http://stalwart.default.svc.cluster.local:8080
            - name: LOGIN
              value: packages@bmwinstead.com
            - name: SSM_PREFIX
              value: /sailing/tofu
            - name: KMS_KEY_ID
              value: alias/sailing
            # The aws CLI and mktemp write here. The root filesystem is read-only.
            - name: HOME
              value: /tmp
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-admin
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-admin
                  key: STALWART_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: stalwart-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            # aws CLI v1 reads AWS_DEFAULT_REGION, not AWS_REGION.
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: stalwart-aws-credentials
                  key: AWS_REGION
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: stalwart-pkg-credentials-script
        - name: tmp
          emptyDir: {}
