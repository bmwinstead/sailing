---
# Applies the settings that Stalwart keeps in its database (OIDC directory, WebUI client ID, accounts) with stalwart-cli.
# The Job stalwart-pkg-credentials mints the app passwords of the package mailbox into AWS SSM.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart-config
spec:
  dependsOn:
    - name: stalwart
  # A Job template is immutable. force replaces the Job when the plan changes.
  force: true
  interval: 1h
  path: ./kubernetes/apps/default/stalwart/config
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: true
