---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
spec:
  chartRef:
    kind: OCIRepository
    name: stalwart
  interval: 1h
  values:
    controllers:
      stalwart:
        # RocksDB has one writer and the volume is ReadWriteOnce, so stop the old pod before the new one starts.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: stalwartlabs/stalwart
              tag: v1.1.1@sha256:5ebdf474b237161742fe4309396af4ae8797c938e8e6eb7e2d4837332c4f9851
            env:
              TZ: America/New_York
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/live
                    port: &http 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /healthz/live
                    port: *http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /healthz/live
                    port: *http
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # The image gives the binary file capability cap_net_bind_service. Without it in the bounding set, exec fails and port 993 cannot bind.
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "NET_BIND_SERVICE"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *http
          imaps:
            port: 993
    route:
      app:
        # LAN only. The admin UI and JMAP are not exposed to the internet by this route.
        # The Cloudflare tunnel keeps its own /jmap route for the Email Worker.
        hostnames:
          - "stalwart.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *http
    persistence:
      config:
        existingClaim: stalwart-config
        globalMounts:
          - path: /etc/stalwart
      data:
        existingClaim: stalwart-data
        globalMounts:
          - path: /var/lib/stalwart
