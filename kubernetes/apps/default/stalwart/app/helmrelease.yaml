---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
spec:
  chartRef:
    kind: OCIRepository
    name: stalwart
  interval: 1h
  values:
    controllers:
      stalwart:
        # One Stalwart node, no cluster coordinator. Stop the old pod before the new one starts.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: stalwartlabs/stalwart
              tag: v1.2.1@sha256:ed3153af935f0125ed0424b2a6d7d5891915a9249189dda76860a27f906b64ea
            env:
              TZ: America/New_York
              # The WebUI sign-in only trusts hosts that Stalwart knows. This makes the Envoy route a trusted host.
              STALWART_PUBLIC_URL: https://stalwart.${SECRET_DOMAIN}
              # Read by config.json (authSecret). CNPG creates this Secret.
              STALWART_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: stalwart-db-app
                    key: password
            # Optional admin sign-in. The owner creates this Secret with SOPS.
            # The Secret has one key, STALWART_RECOVERY_ADMIN, with the value admin:<password>.
            # The chart schema does not allow optional on a secretKeyRef, so this uses envFrom.
            envFrom:
              - secretRef:
                  name: stalwart-admin
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/live
                    port: &http 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /healthz/live
                    port: *http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /healthz/live
                    port: *http
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # The image gives the binary file capability cap_net_bind_service. Without it in the bounding set, exec fails and port 993 cannot bind.
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "NET_BIND_SERVICE"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *http
          imaps:
            port: 993
    route:
      app:
        # LAN only. The admin UI and JMAP are not exposed to the internet by this route.
        # The route "ingest" below is the only public route.
        hostnames:
          - "stalwart.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *http
      # Public route for the Email Worker. The tunnel sends *.${SECRET_DOMAIN} to envoy-external.
      # external-dns makes the DNS record. Cloudflare Access (cloudflare/pkg_mail_access.tf) allows only the Worker.
      # Only /jmap is matched. Any other path gets a 404 from Envoy.
      ingest:
        hostnames:
          - "pkg-ingest.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /jmap
            backendRefs:
              - identifier: app
                port: *http
    configMaps:
      config:
        data:
          # Data store only. Stalwart keeps all other settings in this database.
          # The blob store, the search store, and the in-memory store use their defaults:
          # blobs and search live in this database, and the in-memory store stays in the process.
          # CNPG always serves TLS with its own CA. Stalwart has no field for a CA file,
          # so it encrypts the link and does not check the server certificate.
          config.json: |-
            {
              "@type": "PostgreSql",
              "host": "stalwart-db-rw.default.svc.cluster.local",
              "port": 5432,
              "database": "stalwart",
              "authUsername": "stalwart",
              "authSecret": {
                "@type": "EnvironmentVariable",
                "variableName": "STALWART_DB_PASSWORD"
              },
              "useTls": true,
              "allowInvalidCerts": true
            }
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/stalwart/config.json
            subPath: config.json
            readOnly: true
      # Stalwart keeps no state here when the data store is PostgreSQL. It is scratch space only.
      data:
        type: emptyDir
        globalMounts:
          - path: /var/lib/stalwart
