---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.16.2/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: stalwart
spec:
  # The Stalwart WebUI is a public client. It signs in with the authorization code flow and PKCE,
  # and sends the access token to Stalwart. A fixed client ID lets Stalwart name it in its settings.
  clientID: stalwart
  isPublic: true
  pkceEnabled: true
  # WebUI redirect URI: <origin><base path>/oauth/callback
  callbackUrls:
    - https://stalwart.${SECRET_DOMAIN}/admin/oauth/callback
  allowedUserGroups:
    - name: admins
      namespace: auth
