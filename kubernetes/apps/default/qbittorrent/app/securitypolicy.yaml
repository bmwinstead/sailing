---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: qbittorrent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qbittorrent # generated by the app-template chart: route "app" in release "qbittorrent"
  oidc:
    provider:
      issuer: https://id.${SECRET_DOMAIN}
    clientIDRef:
      name: qbittorrent-oidc
    clientSecret:
      name: qbittorrent-oidc
    redirectURL: https://qbittorrent.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
