---
# Keeps the name of the old app-template Kustomization, so Flux prunes the
# old HelmRelease, OCIRepository and PVC from the same inventory.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id
spec:
  interval: 1h
  path: ./kubernetes/apps/auth/pocket-id-operator/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  # true so dependsOn waits for the CRDs. Apps with a PocketIDOIDCClient depend on this.
  wait: true
