---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/renovate/renovate-operator/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: renovate
  # true (not the repo default false): the renovatejob Kustomization
  # dependsOn this one and needs Flux to actually confirm the HelmRelease
  # is Ready (CRDs installed) before applying the RenovateJob CR that
  # requires them — dependsOn alone only gates on existence, not readiness.
  wait: true
