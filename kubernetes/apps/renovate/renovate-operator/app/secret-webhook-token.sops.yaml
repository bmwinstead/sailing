---
# Shared bearer token for the operator's webhook receiver — validates that
# incoming POSTs to renovate-webhook.${SECRET_DOMAIN}/webhook/v1/github
# actually came from your GitHub App's webhook delivery, not a random
# request to the public URL. Unlike the GitHub App private key, this value
# doesn't come from GitHub — it's arbitrary shared secret material we
# control on both ends, so it's generated and encrypted here already
# (`openssl rand -hex 32`), no placeholder needed.
#
# To finish enabling the webhook feature:
#   1. Reveal the plaintext: sops -d kubernetes/apps/renovate/renovate-operator/app/secret-webhook-token.sops.yaml
#   2. Create the GitHub App per secret.sops.yaml.example if you haven't yet.
#   3. In the App's settings → Webhook: check Active, set Payload URL to
#      https://renovate-webhook.<your SECRET_DOMAIN>/webhook/v1/github,
#      paste the revealed token as the webhook secret, Content type
#      application/json, and subscribe to the "Pull requests" and "Issues"
#      events (Permissions & events tab).
#   4. Copy renovatejob.yaml.example to renovatejob.yaml (it already
#      references this secret) and add it to app/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-webhook-token
  namespace: renovate
  labels:
    renovate-operator.mogenius.com/allow-ref: "true"
type: Opaque
stringData:
  token: ENC[AES256_GCM,data:k+piQjIAp0W527y3ud41JVo50wUJRcgyFTM2cAC9ZgJ4F6po6UEckTVaRweO7lh4wSVG/+nDeLNuNsFOOD+B6g==,iv:46xTwbDeZ2b4UA8Lqvqfnm6L1aO3JwvaAi37F0e6kCU=,tag:YLDr5+Ynli4OCJs6MoAoHA==,type:str]
