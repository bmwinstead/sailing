---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  # NOTE: this only configures the operator deployment itself. Renovate
  # needs a GitHub App credential to actually run jobs — see
  # app/secret.sops.yaml.example and app/renovatejob.yaml.example. Neither
  # exists yet; this HelmRelease installs cleanly but Renovate won't run
  # anything until both are created.
  interval: 1h
  # The client id is random, so read it from the operator Secret. The chart reads
  # the client secret from the same Secret through auth.oidc.existingSecret.
  valuesFrom:
    - kind: Secret
      name: renovate-operator-oidc
      valuesKey: client-id
      targetPath: auth.oidc.clientId
  values:
    replicaCount: 1
    # Web UI. The chart did not expose it before, only the webhook below.
    route:
      enabled: true
      hostnames:
        - "renovate.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    auth:
      oidc:
        enabled: true
        issuerUrl: "https://id.${SECRET_DOMAIN}"
        existingSecret: renovate-operator-oidc
        secretKey: client-secret
        # Explicit, because the chart builds an http:// URL when ingress.tls is unset.
        redirectUrl: "https://renovate.${SECRET_DOMAIN}/auth/callback"
        additionalScopes:
          - groups
    authorization:
      defaults:
        adminGroups:
          - admins
        readerGroups:
          - family
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Webhook receiver: lets GitHub notify the operator immediately on PR
    # rebase-checkbox / Dependency Dashboard checkbox interactions, instead
    # of waiting for the next scheduled RenovateJob run. Optional — only
    # matters if a RenovateJob sets spec.webhook.enabled: true (see
    # renovatejob.yaml.example) and the GitHub App's own Webhook section is
    # configured to point at this route with the token from
    # secret-webhook-token.sops.yaml.example.
    webhook:
      enabled: true
      route:
        enabled: true
        hostnames:
          - "renovate-webhook.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
