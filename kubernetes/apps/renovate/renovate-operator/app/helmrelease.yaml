---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
        # NOTE: this only configures the operator deployment itself.
        # Renovate needs a GitHub credential to actually run jobs — see
        # app/secret.sops.yaml.example and the PR description for the
        # RenovateJob CR (spec.secretRef) that references it. That secret
        # does not exist yet; this HelmRelease will install cleanly but
        # Renovate won't run anything until it's created.
