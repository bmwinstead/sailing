---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cloudflare.yaml
  - ./buildkite.yaml
patches:
  - # Runner pod settings for every Terraform object
    target:
      group: infra.contrib.fluxcd.io
      kind: Terraform
    patch: |-
      apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      metadata:
        name: _
      spec:
        runnerPodTemplate:
          spec:
            envFrom:
              - secretRef:
                  name: tofu-credentials # ../app/secret-credentials.sops.yaml
