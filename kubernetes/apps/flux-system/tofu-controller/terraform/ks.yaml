---
# The Terraform objects. A human approves each plan, see ../README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-controller-terraform
spec:
  dependsOn:
    - name: tofu-controller # Terraform CRD and controller
  interval: 1h
  path: ./kubernetes/apps/flux-system/tofu-controller/terraform
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: false
