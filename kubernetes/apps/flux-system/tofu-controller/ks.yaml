---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-controller
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/tofu-controller/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  # tofu-controller-terraform waits for the Terraform CRD that this HelmRelease installs.
  wait: true
