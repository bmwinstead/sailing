---
# The web UI impersonates the Pocket ID groups. Group "family" has no binding on
# purpose: flux-web-user reads every resource in the cluster, secrets included.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: admins
