---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cooking-backups
spec:
  # No dependsOn on the cooking Kustomization. It uses wait: true and waits for
  # the Cluster, which can need this ObjectStore once it archives to it. The
  # namespace already exists. If it does not, this retries until it does.
  dependsOn:
    - name: barman-cloud-plugin # ObjectStore CRD and plugin
      namespace: cnpg-system
  interval: 1h
  path: ./kubernetes/apps/flux-system/cooking-backups/app
  postBuild:
    substituteFrom:
      - name: cnpg-r2-endpoint # R2_ENDPOINT. Looked up in flux-system. Applied by the flux-system namespace kustomization.
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cooking
  wait: false
