---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  valuesFrom:
    # Flux CRD state metrics for kube-state-metrics (same subchart key as before)
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    # Pins generated names: VMSingle "vm" -> svc vmsingle-vm:8429,
    # VMAlertmanager "vm" -> svc vmalertmanager-vm:9093
    fullnameOverride: vm

    victoria-metrics-operator:
      crds:
        plain: true
      operator:
        # Converts monitoring.coreos.com ServiceMonitor/PodMonitor/PrometheusRule/
        # Probe/ScrapeConfig into VM objects. Requires the prometheus-operator CRDs
        # (installed by the prometheus-operator-crds app).
        disable_prometheus_converter: false
        # Delete converted VM objects when the source Prometheus object is deleted.
        enable_converter_ownership: true

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 7d
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi

    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true # equivalent to the old *NilUsesHelmValues: false

    vmalert:
      enabled: true
      spec:
        selectAllByDefault: true

    alertmanager:
      enabled: true
      spec:
        selectAllByDefault: true

    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: true
      service:
        # Talos serves etcd metrics over plain HTTP on 2381 (talos/patches/controller/cluster.yaml)
        port: 2381
        targetPort: 2381
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames:
              - kube-system
          endpoints:
            - port: http-metrics
              scheme: http

    # Grafana is run by grafana-operator, not this chart
    grafana:
      enabled: false
    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
    defaultDatasources:
      grafanaOperator:
        enabled: false # datasources are managed in grafana/instance/datasource.yaml

    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics

    additionalVictoriaMetricsMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
