---
# eBPF CPU profiling, one privileged pod per node. Kept separate from the log
# shipper (helmrelease.yaml) so only this release needs privileged access.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-profiles
spec:
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h
  values:
    controller:
      type: daemonset
      hostPID: true # needed to see every container's processes
    alloy:
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      securityContext:
        privileged: true
        runAsUser: 0
      resources:
        requests:
          cpu: 50m
        limits:
          memory: 1Gi
      configMap:
        content: |
          // Only pods on this node; the eBPF profiler maps PIDs to containers by cgroup.
          discovery.kubernetes "local_pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "local_pods" {
            targets = discovery.kubernetes.local_pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_container_id"]
              action        = "keep"
              regex         = ".+"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "service_name"
            }
          }

          pyroscope.ebpf "local_pods" {
            targets    = discovery.relabel.local_pods.output
            forward_to = [pyroscope.write.endpoint.receiver]
          }

          pyroscope.write "endpoint" {
            endpoint {
              url = "http://pyroscope.observability.svc.cluster.local:4040"
            }
          }
    rbac:
      create: true
    serviceAccount:
      create: true
    serviceMonitor:
      enabled: true
