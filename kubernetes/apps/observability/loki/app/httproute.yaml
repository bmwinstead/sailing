---
# LAN-only push endpoint for log shippers outside the cluster (the NAS).
# Loki runs with auth_enabled: false, so keep this on envoy-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
spec:
  hostnames:
    - loki.winstead.io
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: loki-gateway
          port: 80
