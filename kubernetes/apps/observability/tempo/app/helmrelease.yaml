---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  chartRef:
    kind: OCIRepository
    name: tempo
  interval: 1h
  values:
    # Single-binary chart. Receivers default to OTLP gRPC 4317 and HTTP 4318,
    # and the query API to 3200. Service "tempo" is ClusterIP.
    tempo:
      retention: 336h
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: config
    serviceMonitor:
      enabled: true
