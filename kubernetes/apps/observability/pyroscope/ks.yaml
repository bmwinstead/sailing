---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pyroscope
spec:
  dependsOn:
    - name: alloy # owns the shared "grafana" HelmRepository
  interval: 1h
  path: ./kubernetes/apps/observability/pyroscope/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
