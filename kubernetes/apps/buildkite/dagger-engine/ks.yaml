---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dagger-engine
spec:
  interval: 1h
  path: ./kubernetes/apps/buildkite/dagger-engine/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: buildkite
  wait: false
