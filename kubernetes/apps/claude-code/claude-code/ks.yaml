---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-code
spec:
  interval: 1h
  path: ./kubernetes/apps/claude-code/claude-code/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: claude-code
  wait: false
