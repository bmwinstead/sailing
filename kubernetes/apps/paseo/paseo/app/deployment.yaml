---
# Paseo daemon (replaces the old `claude rc` devbox from the claude-code
# namespace). Agents are processes inside this one pod: create/destroy them from the Paseo CLI or mobile app,
# no cluster interaction. Reached only over envoy-internal (LAN / WireGuard);
# relay is left disabled (daemon.relay.enabled=false) so nothing goes via
# Paseo's servers. Auth is PASEO_PASSWORD (secret-paseo.sops.yaml).
#
# Image: docker/paseo (Paseo + the old devbox tooling). devbox-init.sh builds
# ~/.kube/config from the ServiceAccount token and wires gh-app-auth, exactly
# as the old entrypoint did — read-only RBAC in rbac.yaml still applies.
#
# First-time setup, via `kubectl exec -it -n paseo deploy/paseo -- bash`:
#   claude auth login        # the home PVC starts empty; log in once
#   git clone https://github.com/bmwinstead/sailing.git ~/sailing
# then add ~/sailing as a project in Paseo. talosctl is already configured
# read-only (os:reader) via the mounted paseo-talosconfig secret.
#
# Containers: the `dind` sidecar runs dockerd, so agents get `docker`, buildx,
# compose, and kind/Dagger/Tilt on top. The two containers share the pod
# network, so kind ports on 127.0.0.1 work. The socket is on a shared emptyDir
# (DOCKER_HOST) with group 1000. Layers live on the paseo-docker PVC.
# SECURITY: the sidecar is privileged. Any agent that can use the socket has
# root-equivalent power in that container, and the container boundary is the
# only wall between it and the host. Cluster-wide PodSecurity admission is off
# (talos/patches/controller/cluster.yaml), so no namespace label is needed.
# Restarting the sidecar stops all nested containers, kind clusters included.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
  labels:
    app: paseo
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC can't be held by two pods during rollout
  selector:
    matchLabels:
      app: paseo
  template:
    metadata:
      labels:
        app: paseo
    spec:
      serviceAccountName: paseo
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000 # `paseo` user in the image
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        # Do not re-chgrp the whole docker data root on every start.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: paseo
          image: ghcr.io/bmwinstead/paseo:latest
          ports:
            - name: http
              containerPort: 6767
          env:
            - name: HOME
              value: /home/paseo
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo
                  key: PASEO_PASSWORD
            # No OS keyring in the container; keep `entire auth login` tokens in
            # ~/.config/entire on the home PVC so they survive restarts.
            - name: ENTIRE_TOKEN_STORE
              value: file
            - name: PASEO_HOSTNAMES
              value: paseo.${SECRET_DOMAIN}
            - name: GH_APP_ID
              value: "5015762"
            - name: GH_APP_PRIVATE_KEY_PATH
              value: /home/paseo/.local/share/gh-app-auth/private-key.pem
            - name: DOCKER_HOST
              value: unix:///var/run/docker-sock/docker.sock
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: talosconfig
              mountPath: /home/paseo/.talos
              readOnly: true
            - name: github-app
              mountPath: /home/paseo/.github-app
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker-sock
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "8"
              memory: "16Gi"
        - name: dind
          image: docker.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
          # Explicit args keep the entrypoint from adding a TCP listener: the
          # daemon is reachable only through the socket. Group 1000 = `paseo`.
          args:
            - dockerd
            - --host=unix:///var/run/docker-sock/docker.sock
            - --group=1000
          securityContext:
            privileged: true # dockerd, and kind nodes, need it
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker-sock
            - name: docker-data
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "16Gi"
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: paseo-home
        - name: talosconfig
          secret:
            secretName: paseo-talosconfig
        - name: github-app
          secret:
            secretName: paseo-github-app
            optional: true
        - name: docker-sock
          emptyDir: {}
        - name: docker-data
          persistentVolumeClaim:
            claimName: paseo-docker
---
apiVersion: v1
kind: Service
metadata:
  name: paseo
spec:
  selector:
    app: paseo
  ports:
    - name: http
      port: 6767
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo
spec:
  hostnames:
    - paseo.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: paseo
          port: 6767
